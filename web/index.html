<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    `flutter build web --base-href /some/path/` replaces this placeholder when
    Orbit is hosted somewhere other than the site root.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Orbit: feed, stories, reels, video, chats and channels in one social app, with an AI coach and wellbeing tools.">
  <meta name="theme-color" content="#7C4DFF">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Orbit">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="manifest" href="manifest.json">
  <title>Orbit</title>

  <style>
    html, body { margin: 0; height: 100%; background: #0B0B12; }
    #splash {
      position: fixed; inset: 0; display: grid; place-items: center; z-index: 10;
      background: linear-gradient(135deg, #7C4DFF, #FF4081 55%, #FFAB40);
      transition: opacity .35s ease;
      font: 800 34px/1 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: #fff; letter-spacing: -1px;
    }
    #splash.done { opacity: 0; pointer-events: none; }
    #splash .mark { display: grid; justify-items: center; gap: 14px; }
    #splash img { width: 88px; height: 88px; border-radius: 22px; box-shadow: 0 12px 32px rgba(0,0,0,.25); animation: float 2.4s ease-in-out infinite; }
    @keyframes float { 50% { transform: translateY(-8px); } }
    @media (prefers-reduced-motion: reduce) { #splash img { animation: none; } }
  </style>
</head>
<body>
  <div id="splash" aria-label="Loading Orbit">
    <div class="mark"><img src="icons/Icon-192.png" alt=""><span>orbit</span></div>
  </div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
