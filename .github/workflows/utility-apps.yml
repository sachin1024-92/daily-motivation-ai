name: Utility apps (Seeti, Bijli Guard, SafeShare ID, Ghar Clock)

on:
  push:
    paths:
      - "utility-apps/**"
      - ".github/workflows/utility-apps.yml"
  pull_request:
    paths:
      - "utility-apps/**"
      - ".github/workflows/utility-apps.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: utility-apps-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Unit tests, lint, APKs and Play bundles
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: utility-apps
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Upload key (from repository secrets)
        env:
          KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "UPLOAD_KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
            echo "Release builds will be signed with your upload key."
          else
            echo "::warning::No UPLOAD_KEYSTORE_BASE64 secret, so release builds are signed with a throwaway debug key and can't be uploaded to Google Play."
          fi

      - name: Build, test and lint all four apps
        env:
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: ./gradlew --no-daemon --continue testDebugUnitTest assembleDebug assembleRelease bundleRelease lintDebug

      - name: Collect the apps
        run: |
          mkdir -p dist
          for m in seeti bijli safeshare gharclock; do
            cp "$m/build/outputs/apk/debug/$m-debug.apk" dist/
            cp "$m/build/outputs/apk/release/$m-release.apk" dist/
            cp "$m/build/outputs/bundle/release/$m-release.aab" dist/
          done
          ls -la dist
          grep -h "TEST ad IDs" -r . --include=*.log 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        with:
          name: utility-apps
          path: utility-apps/dist/
          if-no-files-found: error

      - name: Test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: utility-apps-reports
          path: "utility-apps/*/build/reports/"
          if-no-files-found: ignore

      - name: Delete the key file
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"

  emulator:
    name: Open every app on an Android 14 emulator
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: utility-apps
          path: dist

      - name: Enable hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-boot-anim -camera-back none
          script: bash utility-apps/tools/smoke-test.sh dist shots

      - name: Small copies of the screenshots in the log (for review without downloading)
        if: always()
        run: |
          for f in shots/*.png; do
            [ -f "$f" ] || continue
            echo "===SHOT $(basename "$f" .png)==="
            if command -v convert >/dev/null; then
              convert "$f" -resize 360x -quality 55 jpg:- | base64 -w 0
            else
              base64 -w 0 "$f"
            fi
            echo
            echo "===END==="
          done

      - name: Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: utility-apps-screenshots
          path: shots/
          if-no-files-found: ignore
