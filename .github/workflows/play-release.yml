name: Play release

# Builds a signed Android App Bundle and uploads it to Google Play.
# The very first upload of a new app must be done by hand in Play Console;
# use this workflow for every release after that.
# Required secrets are listed in docs/play-store/README.md.

on:
  workflow_dispatch:
    inputs:
      track:
        description: Play track
        type: choice
        options: [internal, alpha, beta, production]
        default: internal
      status:
        description: Release status
        type: choice
        options: [completed, draft]
        default: completed

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - run: flutter test

      - name: Restore upload key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload-keystore.jks"
          {
            echo "storeFile=$RUNNER_TEMP/upload-keystore.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=upload"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

      - name: Build app bundle
        env:
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
          ADMOB_FEED_UNIT_ID: ${{ secrets.ADMOB_FEED_UNIT_ID }}
        run: |
          if [ -z "$ADMOB_APP_ID" ]; then unset ADMOB_APP_ID; fi
          flutter build appbundle --release \
            --build-number=$((100 + GITHUB_RUN_NUMBER)) \
            --dart-define=ADMOB_FEED_UNIT_ID="$ADMOB_FEED_UNIT_ID"

      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.princendlesster.orbit
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: ${{ inputs.track }}
          status: ${{ inputs.status }}

      - name: Keep the bundle
        uses: actions/upload-artifact@v4
        with:
          name: orbit-release-${{ github.run_number }}
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Remove signing files
        if: always()
        run: rm -f android/key.properties "$RUNNER_TEMP/upload-keystore.jks"
