name: Facebook Page Bot

on:
  schedule:
    - cron: "17 * * * *"   # every hour at :17 (UTC); the bot spreads posts over your active hours
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (print posts, don't publish)"
        type: boolean
        default: true

permissions:
  contents: write   # to commit the state file (prevents duplicate posts)

concurrency:
  group: facebook-bot
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    defaults:
      run:
        working-directory: facebook-page-bot
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: facebook-page-bot/requirements.txt

      - run: pip install -r requirements.txt

      - name: Run bot
        env:
          FB_PAGES_JSON: ${{ secrets.FB_PAGES_JSON }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          IMGFLIP_USERNAME: ${{ secrets.IMGFLIP_USERNAME }}
          IMGFLIP_PASSWORD: ${{ secrets.IMGFLIP_PASSWORD }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python -m bot.main --dry-run --force 1
          else
            python -m bot.main
          fi

      - name: Save state
        if: always() && inputs.dry_run != true
        run: |
          git config user.name "facebook-bot"
          git config user.email "facebook-bot@users.noreply.github.com"
          git add state/state.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "bot: update posting state [skip ci]" && git push)
