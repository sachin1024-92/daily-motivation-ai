name: Secret scan

# Fails the build if anything that looks like a private API key, token or signing key
# is committed. Public identifiers (AdMob app/ad unit IDs, Google Analytics IDs) are fine.
on:
  push:
  pull_request:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Look for keys and tokens
        run: |
          pattern='xai-[A-Za-z0-9]{16,}|sk-ant-[A-Za-z0-9_-]{16,}|sk-(proj-)?[A-Za-z0-9_-]{32,}|AIza[0-9A-Za-z_-]{30,}|gsk_[A-Za-z0-9]{20,}|ghp_[A-Za-z0-9]{30,}|github_pat_[A-Za-z0-9_]{30,}|AKIA[0-9A-Z]{16}|-----BEGIN [A-Z ]*PRIVATE KEY-----'
          if git grep -I -n -E -e "$pattern" -- . ':!.github/workflows/secret-scan.yml' | cut -c1-80; then
            echo "::error::Something that looks like a private key or token is in the repository. Remove it and revoke that key."
            exit 1
          fi
          if git ls-files | grep -E '\.(jks|keystore|p12|pem)$|(^|/)\.env$'; then
            echo "::error::A keystore, certificate or .env file is committed."
            exit 1
          fi
          echo "No keys found."
