name: FloatNote Android

on:
  push:
    branches: ['**']
    tags: ['floatnote-v*']
  pull_request:
    paths:
      - 'floating-notepad/**'
      - '.github/workflows/floating-notepad.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK & AAB
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: floating-notepad

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode release keystore (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.FLOATNOTE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "FLOATNOTE_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "No release keystore configured; release build will be signed with the debug key."
          fi

      - name: Build
        env:
          FLOATNOTE_KEYSTORE_PASSWORD: ${{ secrets.FLOATNOTE_KEYSTORE_PASSWORD }}
          FLOATNOTE_KEY_ALIAS: ${{ secrets.FLOATNOTE_KEY_ALIAS }}
          FLOATNOTE_KEY_PASSWORD: ${{ secrets.FLOATNOTE_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleDebug assembleRelease bundleRelease lintDebug

      - name: Collect outputs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/FloatNote.apk
          cp app/build/outputs/apk/debug/app-debug.apk dist/FloatNote-debug.apk
          cp app/build/outputs/bundle/release/app-release.aab dist/FloatNote.aab

      - uses: actions/upload-artifact@v4
        with:
          name: FloatNote-${{ github.run_number }}
          path: floating-notepad/dist/*
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: FloatNote-lint-${{ github.run_number }}
          path: floating-notepad/app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/floatnote-v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            floating-notepad/dist/FloatNote.apk
            floating-notepad/dist/FloatNote.aab
