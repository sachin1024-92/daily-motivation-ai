name: FloatNote Android

on:
  push:
    branches: ['**']
    tags: ['floatnote-v*']
  pull_request:
    paths:
      - 'floating-notepad/**'
      - '.github/workflows/floating-notepad.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK & AAB
    runs-on: ubuntu-latest
    env:
      PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
    defaults:
      run:
        working-directory: floating-notepad

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode release keystore (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.FLOATNOTE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "FLOATNOTE_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "No release keystore configured; release build will be signed with the debug key."
          fi

      - name: Build
        env:
          FLOATNOTE_KEYSTORE_PASSWORD: ${{ secrets.FLOATNOTE_KEYSTORE_PASSWORD }}
          FLOATNOTE_KEY_ALIAS: ${{ secrets.FLOATNOTE_KEY_ALIAS }}
          FLOATNOTE_KEY_PASSWORD: ${{ secrets.FLOATNOTE_KEY_PASSWORD }}
          # Optional. Without these the build uses Google's test ad IDs.
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
          ADMOB_BANNER_ID: ${{ secrets.ADMOB_BANNER_ID }}
        run: ./gradlew --no-daemon assemblePlayDebug assemblePlayRelease bundlePlayRelease assembleFossRelease lintPlayDebug

      - name: Collect outputs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/play/release/app-play-release.apk dist/FloatNote.apk
          cp app/build/outputs/apk/play/debug/app-play-debug.apk dist/FloatNote-debug.apk
          cp app/build/outputs/apk/foss/release/app-foss-release.apk dist/FloatNote-foss.apk
          cp app/build/outputs/bundle/playRelease/app-play-release.aab dist/FloatNote.aab

      - uses: actions/upload-artifact@v4
        with:
          name: FloatNote-${{ github.run_number }}
          path: floating-notepad/dist/*
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: FloatNote-lint-${{ github.run_number }}
          path: floating-notepad/app/build/reports/lint-results-playDebug.html
          if-no-files-found: ignore

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/floatnote-v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            floating-notepad/dist/FloatNote.apk
            floating-notepad/dist/FloatNote-foss.apk
            floating-notepad/dist/FloatNote.aab

      # Uploads tagged releases to Play's internal testing track as a draft. Needs a Play
      # Console service account JSON key in the PLAY_SERVICE_ACCOUNT_JSON secret.
      - name: Upload to Google Play (internal track)
        if: startsWith(github.ref, 'refs/tags/floatnote-v') && env.PLAY_SERVICE_ACCOUNT_JSON != ''
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: io.github.sachin102492.floatnote
          releaseFiles: floating-notepad/dist/FloatNote.aab
          track: internal
          status: draft
          whatsNewDirectory: floating-notepad/fastlane/metadata/android/en-US/whatsnew
