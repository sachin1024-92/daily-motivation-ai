publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  shared_preferences: ^2.2.3
  intl: ^0.19.0
  http: ^1.2.1
  cupertino_icons: ^1.0.6
  flutter_local_notifications: ^17.2.1+2

  # Firebase (uncomment and configure when ready)
  # firebase_core: ^3.2.0
  # cloud_firestore: ^5.0.0
  # firebase_auth: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
