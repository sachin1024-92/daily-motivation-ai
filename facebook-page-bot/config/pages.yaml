# Facebook Page Bot configuration
#
# Each entry below is one Facebook Page you created and manage.
# Page IDs and access tokens are NOT stored here. They go in the
# FB_PAGES_JSON secret (see README.md), keyed by the `key` of each page.
#
# content: weighted mix of post types for that page. Available types:
#   ai_text      - original text post written by the AI in the page's voice
#   news         - real headline from an RSS feed, summarised + linked to source
#   photo        - free-licence photo from Pexels + AI caption (credits photographer)
#   video        - free-licence video clip from Pexels + AI caption
#   reel         - vertical Pexels clip published as a Facebook Reel (best reach)
#   meme         - meme generated from a popular template via the Imgflip API
#                  with AI-written original captions

settings:
  timezone: "UTC"          # change to your timezone, e.g. "Asia/Kolkata", "America/New_York"
  active_hours: [7, 23]    # posts are spread between these local hours
  max_posts_per_run: 4     # safety cap per hourly run
  graph_api_version: "v23.0"
# Per page you can also set trends_geo (default "US", e.g. "IN", "GB") - the AI uses
# that country's live Google Trends searches to make posts about what people want now.
  ai_provider: "grok"      # "grok" (xAI) or "claude" (Anthropic)
  ai_model: ""             # leave blank for the provider default

pages:
  - key: comedy
    name: "Daily Laughs"
    posts_per_day: 5         # Facebook may throttle new pages that post a lot; raise slowly (max 20)
    voice: "A witty, family-friendly comedy page. Short punchy jokes, relatable everyday humour, puns."
    content: {meme: 5, ai_text: 3, reel: 2}
    photo_queries: ["funny dog", "funny cat", "silly face", "office life"]

  - key: entertainment
    name: "Showbiz Buzz"
    posts_per_day: 5
    voice: "An upbeat entertainment page covering movies, TV, music and celebrity news. Fun, curious tone."
    content: {news: 5, ai_text: 1, photo: 1}
    feeds:
      - "https://feeds.bbci.co.uk/news/entertainment_and_arts/rss.xml"
      - "https://variety.com/feed/"
    photo_queries: ["cinema", "concert crowd", "movie popcorn"]

  - key: news
    name: "World Brief"
    posts_per_day: 5
    voice: "A neutral, factual world-news page. No opinions, no sensationalism, always cite the source."
    content: {news: 1}
    feeds:
      - "https://feeds.bbci.co.uk/news/world/rss.xml"
      - "https://www.aljazeera.com/xml/rss/all.xml"
      - "https://rss.nytimes.com/services/xml/rss/nyt/World.xml"

  - key: games
    name: "Game Zone"
    posts_per_day: 5
    voice: "An enthusiastic gaming page. Gaming news, nostalgia, polls like 'which would you pick?', gamer humour."
    content: {news: 4, meme: 2, ai_text: 2, reel: 1}
    feeds:
      - "https://www.gamespot.com/feeds/news/"
      - "https://www.polygon.com/rss/index.xml"
      - "https://www.eurogamer.net/feed"

  - key: motivation
    name: "Rise & Grind Daily"
    posts_per_day: 5
    voice: "An inspiring motivation page. Original short quotes, discipline and growth mindset, positive and warm."
    content: {reel: 4, photo: 3, ai_text: 2}
    photo_queries: ["sunrise mountain", "running athlete", "ocean horizon", "city skyline dawn"]

  - key: sports
    name: "Sports Pulse"
    posts_per_day: 5
    voice: "An energetic sports page. Scores, big moments and fan debates across football, cricket, basketball."
    content: {news: 5, ai_text: 1}
    feeds:
      - "https://feeds.bbci.co.uk/sport/rss.xml"
      - "https://www.espn.com/espn/rss/news"

  - key: tech
    name: "Tech Today"
    posts_per_day: 5
    voice: "A clear, curious tech page. Gadgets, AI, apps and science explained simply."
    content: {news: 5, ai_text: 1}
    feeds:
      - "https://feeds.bbci.co.uk/news/technology/rss.xml"
      - "https://www.theverge.com/rss/index.xml"
      - "https://techcrunch.com/feed/"

  - key: food
    name: "Tasty Corner"
    posts_per_day: 5
    voice: "A mouth-watering food page. Quick recipe ideas, cooking tips, food polls ('pizza or burger?')."
    content: {reel: 4, photo: 3, ai_text: 1}
    photo_queries: ["street food", "dessert", "pizza", "indian food", "breakfast"]

  - key: travel
    name: "Wander Daily"
    posts_per_day: 5
    voice: "A dreamy travel page. Beautiful places, travel tips, 'where would you go?' questions."
    content: {reel: 4, photo: 4, ai_text: 1}
    photo_queries: ["beach", "mountains", "old town street", "waterfall", "desert"]

  - key: facts
    name: "Did You Know?"
    posts_per_day: 5
    voice: "A fun-facts page. Surprising, TRUE and well-known facts about science, history, animals and space. Never invent facts."
    content: {ai_text: 4, photo: 2, reel: 1}
    photo_queries: ["space galaxy", "ancient ruins", "wild animal", "microscope"]
